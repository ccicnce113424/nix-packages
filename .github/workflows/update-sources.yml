name: Update Sources

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: update-sources
  cancel-in-progress: true

jobs:
  update-sources:
    runs-on: ubuntu-latest
    name: Update Sources
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            accept-flake-config = true

      - name: Update sources
        run: |
          nix flake update
          NIXPKGS_PATH=$(nix eval --raw .#nixpkgs)
          export NIX_PATH="nixpkgs=$NIXPKGS_PATH"
          nix run -L .#nvfetcher-bin
          git add .
          # cp "$NIXPKGS_PATH/pkgs/by-name/mo/motrix-next/package.nix" ./pkgs/motrix-next
          _scripts/run-update-scripts.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          commit-message: Update sources
          branch: ci/update-sources
          delete-branch: true
          title: Update sources
          labels: dependencies
