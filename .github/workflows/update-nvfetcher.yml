name: Update NVFetcher

# Bulk fallback for the per-unit updates done by `update-packages.yml`: refresh every
# nvfetcher source and regenerate all update script outputs in one "Update sources" PR.

on:
  workflow_dispatch:

concurrency:
  group: update-nvfetcher
  cancel-in-progress: true

jobs:
  nvfetcher:
    runs-on: ubuntu-latest
    name: Update Sources
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            accept-flake-config = true

      - name: Update sources
        run: |
          _scripts/run-update-scripts.sh
          git add .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          commit-message: Update sources
          branch: ci/update-sources
          delete-branch: true
          title: Update sources
          labels: dependencies
